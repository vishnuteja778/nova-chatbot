<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nova</title>
  <meta name="description" content="Nova, an AI assistant that can read your documents. Built by Vishnu Teja.">
  <meta name="theme-color" id="theme-color" content="#FAFAFB">
  <!-- Pick the theme before the page paints, so there is no flash of the wrong one. -->
  <script>
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem("nova-theme")); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230C0C10'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23F4F4F6' stroke-width='1.6'/><circle cx='16' cy='16' r='3.4' fill='%236392FF'/><circle cx='25' cy='16' r='2' fill='%23F4F4F6'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Decorative background: dot grid, soft glow, and a light that follows the cursor -->
  <div class="backdrop" id="backdrop" aria-hidden="true"><span class="aurora"></span></div>

  <div class="app">
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="Nova home">
        <svg class="mark" id="mark" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="m-ring" cx="12" cy="12" r="8.5"/>
          <circle class="m-core" cx="12" cy="12" r="2.8"/>
          <g class="m-sat"><circle cx="20.5" cy="12" r="1.7"/></g>
        </svg>
        <span class="name">Nova</span>
      </a>

      <div class="topbar-right">
        <span class="status" title="Model in use"><span class="pulse"></span><span id="model">connecting</span></span>

        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch theme" data-magnetic>
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <mask id="moon-mask">
              <rect width="24" height="24" fill="#fff" stroke="none"/>
              <circle class="moon-cut" cx="27" cy="7" r="7" fill="#000" stroke="none"/>
            </mask>
            <circle class="sun-core" cx="12" cy="12" r="4.6" mask="url(#moon-mask)"/>
            <g class="sun-rays">
              <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
            </g>
          </svg>
        </button>

        <button class="btn" id="new-chat" type="button" data-ripple>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="label">New chat</span>
        </button>
      </div>
    </header>

    <main class="chat" id="chat">
      <section class="welcome play" id="welcome">
        <div class="hero-mark" aria-hidden="true">
          <span class="burst"></span><span class="burst"></span><span class="burst"></span>
          <span class="tile">
            <svg class="mark" viewBox="0 0 24 24">
              <circle class="m-ring" cx="12" cy="12" r="8.5"/>
              <circle class="m-core" cx="12" cy="12" r="2.8"/>
              <g class="m-sat"><circle cx="20.5" cy="12" r="1.7"/></g>
            </svg>
          </span>
        </div>

        <h2 class="headline" aria-label="What shall we figure out?">
          <span class="w" style="--i:0">What</span>
          <span class="w" style="--i:1">shall</span>
          <span class="w" style="--i:2">we</span>
          <span class="w hl" style="--i:3">figure</span>
          <span class="w hl" style="--i:4">out?</span>
        </h2>
        <p class="lede">Ask a question, or attach a PDF, Word document or code file and work through it together.</p>

        <div class="suggestions">
          <button type="button" class="suggestion" data-ripple data-prompt="Explain what an API is, using a restaurant analogy.">
            <span class="s-top">
              <span class="s-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8.5L5 12l3.5 3.5M15.5 8.5L19 12l-3.5 3.5M13.5 6l-3 12"/></svg></span>
              <svg class="s-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </span>
            <span class="s-text">Explain APIs with a restaurant analogy</span>
          </button>
          <button type="button" class="suggestion" data-ripple data-prompt="Give me three beginner Python project ideas that teach real skills. Use a table.">
            <span class="s-top">
              <span class="s-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8l4 4-4 4M12.5 16.5h6"/></svg></span>
              <svg class="s-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </span>
            <span class="s-text">Three Python projects that teach real skills</span>
          </button>
          <button type="button" class="suggestion" data-ripple data-prompt="Analyse Tata Consultancy Services stock: price trend, financials, latest news, and your short-term outlook.">
            <span class="s-top">
              <span class="s-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 4 7-8M15 8h5v5"/></svg></span>
              <svg class="s-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </span>
            <span class="s-text">Analyse TCS stock: trend, financials and news</span>
          </button>
        </div>
      </section>

      <div class="messages" id="messages"></div>
    </main>

    <form class="composer" id="composer">
      <button type="button" class="jump" id="jump" aria-label="Jump to the latest message" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>

      <div class="access hidden" id="access">
        <label for="access-code">This Nova is private. Enter the access code.</label>
        <input id="access-code" type="password" autocomplete="off" placeholder="Access code">
      </div>

      <div class="attachments" id="attachments" aria-live="polite"></div>

      <div class="field" id="field">
        <button type="button" class="icon-btn attach" id="attach-btn" aria-label="Attach files" title="Attach files" data-magnetic>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
        </button>
        <input type="file" id="file-input" multiple hidden
          accept=".pdf,.docx,.txt,.md,.markdown,.csv,.tsv,.json,.xml,.yaml,.yml,.html,.htm,.css,.js,.mjs,.ts,.jsx,.tsx,.py,.ipynb,.java,.c,.h,.cpp,.hpp,.cs,.go,.rs,.rb,.php,.sql,.sh,.ps1,.bat,.ini,.toml,.cfg,.log,.tex,.r,.kt,.swift,.dart,.lua,.vue,.svelte">
        <textarea id="input" rows="1" placeholder="Message Nova" aria-label="Message Nova" maxlength="8000"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled data-magnetic>
          <span class="arrows" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
          </span>
          <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="7.5" width="9" height="9" rx="2"/></svg>
          <svg class="ring" viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="23"/></svg>
        </button>
      </div>
      <p class="hint"><kbd>Enter</kbd> to send <span class="sep"></span> <kbd>Shift</kbd> <kbd>Enter</kbd> for a new line <span class="sep"></span> drop files anywhere</p>
    </form>
  </div>

  <div class="dropzone" id="dropzone" aria-hidden="true">
    <div class="drop-panel">
      <svg class="drop-border" preserveAspectRatio="none" aria-hidden="true"><rect x="1" y="1" rx="24" ry="24"/></svg>
      <span class="drop-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></span>
      <p class="drop-title">Drop files to attach</p>
      <p class="drop-sub">PDF, Word, text and code files, up to 4 MB each</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
